<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recollida de bossa i samarreta — Llobregat x la Diabetis</title>
<meta name="description" content="Punts, dies i horaris per recollir la bossa, la pulsera i la samarreta del repte Llobregat x la Diabetis.">
<link rel="icon" type="image/png" href="img/logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blau:#15315F;--blau2:#1E72D4;--aigua:#5AC0E6;--coral:#FF6B47;--paper:#FAFAF6;--tinta:#0E1B36;--gris:#5A6478;--vora:#E4E8F0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--tinta);font-family:'Manrope',sans-serif;line-height:1.55}
  header{background:var(--blau);color:#fff}
  .hin{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;color:#fff;text-decoration:none}
  .brand img{height:28px;width:28px;border-radius:50%}
  .lang{display:flex;gap:4px}
  .lang button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#D7E3F5;font:700 11.5px 'Manrope',sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--blau);border-color:#fff}
  main{max-width:900px;margin:0 auto;padding:24px 16px 56px}
  h1{font-family:'Bricolage Grotesque',sans-serif;color:var(--blau);font-size:32px;line-height:1.1;margin:0 0 10px}
  h2{font-family:'Bricolage Grotesque',sans-serif;color:var(--blau);font-size:20px;margin:28px 0 10px}
  .lead{font-size:17px;color:var(--gris);max-width:680px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:8px}
  .p{background:#fff;border:1px solid var(--vora);border-radius:14px;padding:16px}
  .p h3{margin:0 0 6px;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:var(--blau)}
  .p .q{font-weight:700;color:var(--blau2);font-size:14.5px}
  .p .per{font-size:13.5px;color:var(--gris);margin-top:6px}
  .p .q.pend{display:inline-block;background:#FFF3D6;color:#8A5A00;border:1px solid #F5C451;border-radius:8px;padding:4px 10px}
  .p .mapa{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--blau2);text-decoration:none}
  .p .mapa:hover{text-decoration:underline}
  .nota{background:#EEF5FF;border:1px solid #C9DDF7;border-radius:12px;padding:14px 16px;margin-top:18px;font-size:15px}
  .nota.coral{background:#FFF3EE;border-color:#FFD2C4}
  ul{padding-left:20px}
  a.btn{display:inline-block;margin-top:10px;background:var(--coral);color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><div class="hin">
  <a class="brand" href="index.html"><img src="img/logo-small.png" alt=""><span>Llobregat x la Diabetis</span></a>
  <div class="lang" id="lang"><button data-l="ca">CA</button><button data-l="es">ES</button><button data-l="en">EN</button></div>
</div></header>
<main>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <h2 id="hPunts"></h2>
  <div class="grid" id="grid"></div>
  <div class="nota" id="nQr"></div>
  <div class="nota coral" id="nPuls"></div>
  <h2 id="hCom"></h2>
  <ul id="llCom"></ul>
</main>
<script>
(function(){
  var D={
    ca:{h1:'On recollir la bossa i la samarreta',lead:'La recollida es fa per proximitat. Rebràs per correu el teu QR personal amb el punt que t\'hem assignat segons el municipi que vas triar.',hPunts:'Punts de recollida',
      per:'Per a:',mapa:'📍 Com arribar-hi',nQr:'Porta el QR del correu (o obre el teu perfil des del botó del correu) i ensenya\'l a la taula de recollida del teu punt. Hi recolliràs la bossa, la pulsera, la samarreta i, si et correspon, el pack Glucody.',
      nPuls:'La pulsera és obligatòria durant tot el repte: és necessària per a l\'assegurança i per accedir a l\'avituallament.',
      hCom:'Com funciona',
      com:['Cada persona rep un correu amb el seu QR i un botó per anar al seu perfil.','Des del perfil pots canviar el punt de recollida fins l\'11 d\'octubre. A partir del 12 d\'octubre ja no es pot canviar.','A la taula de recollida, un voluntari escaneja el QR i et lliura el material. Només et poden atendre a la taula que tens assignada.','Si no trobes el correu, escriu-nos a info@llobregat.org.'],err:'No s\'han pogut carregar els punts. Torna-ho a provar.'},
    es:{h1:'Dónde recoger la bolsa y la camiseta',lead:'La recogida se hace por proximidad. Recibirás por correo tu QR personal con el punto que te hemos asignado según el municipio que elegiste.',hPunts:'Puntos de recogida',
      per:'Para:',mapa:'📍 Cómo llegar',nQr:'Lleva el QR del correo (o abre tu perfil desde el botón del correo) y enséñalo en la mesa de recogida de tu punto. Allí recogerás la bolsa, la pulsera, la camiseta y, si te corresponde, el pack Glucody.',
      nPuls:'La pulsera es obligatoria durante todo el reto: es necesaria para el seguro y para acceder al avituallamiento.',
      hCom:'Cómo funciona',
      com:['Cada persona recibe un correo con su QR y un botón para ir a su perfil.','Desde el perfil puedes cambiar el punto de recogida hasta el 11 de octubre. A partir del 12 de octubre ya no se puede cambiar.','En la mesa de recogida, un voluntario escanea el QR y te entrega el material. Solo te pueden atender en la mesa que tienes asignada.','Si no encuentras el correo, escríbenos a info@llobregat.org.'],err:'No se han podido cargar los puntos. Inténtalo de nuevo.'},
    en:{h1:'Where to collect your bag and t-shirt',lead:'Collection is by proximity. You will receive your personal QR by email with the point we have assigned to you based on the town you chose.',hPunts:'Pickup points',
      per:'For:',mapa:'📍 Get directions',nQr:'Bring the QR from your email (or open your profile from the email button) and show it at your point\'s pickup table. You will collect your bag, wristband, t-shirt and, if applicable, the Glucody pack.',
      nPuls:'The wristband is mandatory throughout the challenge: it is required for insurance and to access the aid stations.',
      hCom:'How it works',
      com:['Everyone receives an email with their QR and a button to their profile.','From your profile you can change your pickup point until October 11. From October 12 it can no longer be changed.','At the pickup table, a volunteer scans the QR and hands over your items. You can only be served at the table assigned to you.','If you can\'t find the email, write to info@llobregat.org.'],err:'Could not load the points. Please try again.'}
  };
  var $=function(i){return document.getElementById(i)};
  var lang=new URLSearchParams(location.search).get('lang');
  try{if(!lang)lang=localStorage.getItem('lxd-lang')}catch(e){}
  if(['ca','es','en'].indexOf(lang)<0)lang=(navigator.language||'ca').slice(0,2);
  if(['ca','es','en'].indexOf(lang)<0)lang='ca';
  var punts=null;
  function pinta(){
    var T=D[lang];document.documentElement.lang=lang;
    document.querySelectorAll('#lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
    $('h1').textContent=T.h1;$('lead').textContent=T.lead;$('hPunts').textContent=T.hPunts;
    $('nQr').textContent=T.nQr;$('nPuls').textContent=T.nPuls;$('hCom').textContent=T.hCom;
    var ul=$('llCom');ul.textContent='';T.com.forEach(function(c){var li=document.createElement('li');li.textContent=c;ul.appendChild(li)});
    var g=$('grid');g.textContent='';
    if(!punts){g.textContent=T.err;return}
    punts.forEach(function(p){
      var d=document.createElement('div');d.className='p';
      var h=document.createElement('h3');h.textContent=p.nom[lang];
      var q=document.createElement('div');q.className='q'+(p.pendent?' pend':'');q.textContent=p.quan[lang];
      var r=document.createElement('div');r.className='per';r.textContent=T.per+' '+p.per[lang];
      d.appendChild(h);d.appendChild(q);d.appendChild(r);
      if(p.mapa){var a=document.createElement('a');a.href=p.mapa;a.target='_blank';a.rel='noopener';a.className='mapa';a.textContent=T.mapa;d.appendChild(a)}
      g.appendChild(d);
    });
  }
  document.querySelectorAll('#lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem('lxd-lang',lang)}catch(e){};pinta()}});
  pinta();
  fetch('/.netlify/functions/punts-publics').then(function(r){return r.json()}).then(function(j){if(j&&j.ok){punts=j.punts;pinta()}}).catch(function(){});
})();
</script>
</body>
</html>
