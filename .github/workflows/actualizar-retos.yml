name: Actualizar retos MGA

on:
  schedule:
    - cron: '*/15 * * * *'  # cada 15 minutos
  workflow_dispatch:        # además, botón "Run workflow" manual en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install cheerio

      - name: Ejecutar scraper
        run: node scripts/fetch-retos.mjs

      # Donaciones individuales para la página /botella. Si el scraper no
      # reconoce nada (cambio de HTML de MGA) falla y NO toca el JSON; con
      # continue-on-error el resto del flujo (retos.json) sigue funcionando.
      - name: Ejecutar scraper de donaciones
        continue-on-error: true
        run: node scripts/fetch-donaciones.mjs 2>&1 | tee dona/_log-donaciones.txt

      - name: Commit si hay cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dona/retos.json
          # donaciones.json puede no existir aún (primer arranque o scraper sin reconocer nada):
          # un 'git add' de un fichero inexistente abortaría el paso y bloquearía retos.json.
          if [ -f dona/donaciones.json ]; then git add dona/donaciones.json; fi
          if [ -f dona/_log-donaciones.txt ]; then git add dona/_log-donaciones.txt; fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualiza retos.json [automático]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # dona/retos.json ya NO lo sirve Netlify (para no gastar créditos de
      # build en cada actualización) — lo sirve jsDelivr, una CDN gratuita
      # que lee directo de este repo público. jsDelivr cachea hasta 12h por
      # defecto, así que tras cada commit forzamos que recoja el cambio ya.
      - name: Purgar caché de jsDelivr
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dona/retos.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dona/donaciones.json"
