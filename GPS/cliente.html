<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llobregat x la Diabetis — En directe</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0E1B36; --llobregat:#15315F; --diabetis:#1E72D4;
    --aigua:#5AC0E6; --coral:#FF6B47; --paper:#FAFAF6; --gris:#5A6478;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--tinta); font-family:'Manrope',sans-serif; color:var(--paper);}
  #app{max-width:480px; margin:0 auto; height:100vh; display:flex; flex-direction:column;}

  #hud{padding:12px 14px 10px; background:var(--llobregat); z-index:20;}
  #hud .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:14px;}
  #hud .subtitle{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--aigua); margin-bottom:8px;}
  .xpbar-row{display:flex; align-items:center; gap:8px;}
  .xpbar-wrap{flex:1; height:12px; background:rgba(255,255,255,0.12); border:2px solid rgba(90,192,230,0.4); border-radius:8px; overflow:hidden; position:relative;}
  .xpbar-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--diabetis), var(--aigua)); transition:width 0.4s ease;}
  .xptick{ position:absolute; top:0; bottom:0; width:2px; background:rgba(14,27,54,0.6); z-index:2; }
  #levellabel{font-family:'Press Start 2P', monospace; font-size:8px; color:var(--aigua); white-space:nowrap;}
  #kmlabel{font-family:'Press Start 2P', monospace; font-size:8px; color:var(--coral); white-space:nowrap;}
  #nextcp{font-size:11px; margin-top:6px; color:var(--paper); opacity:0.9;}
  #nextcp b{color:var(--aigua);}

  #mapwrap{flex:1; position:relative; overflow-y:auto; overflow-x:hidden; background:#0a1220;}
  #mapinner{ position:relative; width:100%; }
  #mapimg{ display:block; width:100%; height:auto; }
  #loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--aigua); }

  #modetoggle{
    position:absolute; top:8px; right:8px; z-index:30;
    background:var(--llobregat); color:var(--paper); border:1px solid var(--aigua);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:11px;
    border-radius:20px; padding:8px 14px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }

  #gpsview{ display:none; position:absolute; inset:0; z-index:1; }
  #gpsmap{ width:100%; height:100%; }
  #gpsempty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px; font-size:13px; color:var(--gris); background:var(--tinta);
  }
  .runner-gps-icon{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--paper);
    box-shadow:0 0 12px rgba(255,107,71,0.8); overflow:hidden; background:var(--coral);
  }
  .runner-gps-icon img{ width:100%; height:100%; object-fit:contain; }

  #runner{
    position:absolute; width:38px; height:38px; margin:-32px 0 0 -19px;
    transition: left 0.6s ease-out, top 0.6s ease-out;
    z-index:15; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.6));
  }
  #runner img{ width:100%; height:100%; object-fit:contain; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}

  .cp-marker{
    position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px;
    background:var(--tinta); border:2px solid var(--gris); border-radius:50%;
    z-index:10;
  }
  .cp-marker.reached{ background:var(--diabetis); border-color:var(--aigua); box-shadow:0 0 8px rgba(90,192,230,0.8); }

  .cp-eta{
    position:absolute; transform:translate(-50%, 6px);
    font-family:'Press Start 2P', monospace; font-size:6.5px; color:var(--paper);
    background:rgba(14,27,54,0.85); border:1px solid var(--gris); border-radius:4px;
    padding:3px 5px; white-space:nowrap; z-index:11; pointer-events:none;
  }
  .cp-eta.done{ color:var(--aigua); border-color:var(--aigua); }
  .cp-eta.current{ color:var(--coral); border-color:var(--coral); }

  #toast{
    position:absolute; left:50%; top:14px; transform:translate(-50%,-140%);
    z-index:50; background:var(--coral); color:var(--tinta);
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:13px;
    padding:10px 16px; border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,0.4);
    white-space:nowrap; transition:transform 0.4s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
  }
  #toast.show{ transform:translate(-50%, 0); }

  #panel{ background:var(--tinta); border-top:1px solid rgba(90,192,230,0.25); z-index:20; padding:10px 14px 14px; }
  #status-line{ font-size:12px; color:var(--aigua); margin-bottom:6px; }
  #note{ font-size:9px; color:var(--gris); line-height:1.4; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="title">Llobregat <span style="color:var(--aigua); font-style:italic;">x la</span> Diabetis</div>
    <div class="subtitle">En directe</div>
    <div class="xpbar-row">
      <div id="levellabel">LV.1</div>
      <div class="xpbar-wrap" id="xpwrap"><div class="xpbar-fill" id="xpfill"></div></div>
      <div id="kmlabel">0.0 / 0.0 KM</div>
    </div>
    <div id="nextcp">Proper punt: <b>—</b></div>
  </div>

  <div id="mapwrap">
    <button id="modetoggle">🛰️ Mode GPS</button>
    <div id="mapinner">
      <div id="loading">Carregant mapa...</div>
      <img id="mapimg" src="">
      <div id="toast">🏅 Checkpoint!</div>
    </div>
    <div id="gpsview">
      <div id="gpsmap"></div>
      <div id="gpsempty">📡 Encara no hi ha senyal GPS.<br>Prova el mode Fantasy mentrestant.</div>
    </div>
  </div>

  <div id="panel">
    <div id="status-line">Connectant...</div>
    <div id="note">La posició s'actualitza automàticament segons el ritme marcat des del control de la cursa.</div>
  </div>
</div>

<script>
const FUNCTIONS_BASE = '/.netlify/functions';

let fullPath = [];       // tots els punts (traçat + checkpoints), en ordre
let checkpoints = [];    // només els punts amb nom
let checkpointArc = [];  // fracció (0-1) de cada checkpoint sobre fullPath
let cumKm = [];
let totalKm = 0;

function arcLengthTable(points){
  const arclen = [0];
  for (let i=1;i<points.length;i++){
    const dx = points[i].xPct - points[i-1].xPct;
    const dy = points[i].yPct - points[i-1].yPct;
    arclen.push(arclen[i-1] + Math.hypot(dx,dy));
  }
  return arclen;
}

function pointOnPath(arcFrac){
  const n = fullPath.length;
  if (n === 0) return { x:50, y:50 };
  const pos = Math.min(Math.max(arcFrac,0),1) * (n-1);
  const i0 = Math.floor(pos), i1 = Math.min(i0+1, n-1);
  const t = pos - i0;
  const a = fullPath[i0], b = fullPath[i1];
  return { x: a.xPct + (b.xPct-a.xPct)*t, y: a.yPct + (b.yPct-a.yPct)*t };
}

function arcFracAtKm(km){
  km = Math.min(Math.max(km,0), totalKm);
  for (let i=1;i<cumKm.length;i++){
    if (km <= cumKm[i]){
      const segStart = cumKm[i-1], segEnd = cumKm[i];
      const t = segEnd===segStart ? 0 : (km-segStart)/(segEnd-segStart);
      return checkpointArc[i-1] + (checkpointArc[i]-checkpointArc[i-1])*t;
    }
  }
  return 1;
}

/* =========================================================
   CÀRREGA DE CONFIGURACIÓ
   ========================================================= */
async function loadConfig(){
  const res = await fetch(`${FUNCTIONS_BASE}/get-config`, { cache: 'no-store' });
  const config = await res.json().catch(() => ({}));

  if (!res.ok || !Array.isArray(config.points) || config.points.length === 0) {
    document.getElementById('loading').textContent =
      '⚠ No s\'ha pogut carregar el mapa' + (config.detail ? ': ' + config.detail : ' (encara no hi ha configuració desada)');
    document.getElementById('status-line').textContent = '⚠ Sense configuració al servidor';
    return false;
  }

  document.getElementById('mapimg').src = config.mapImage;
  document.getElementById('loading').style.display = 'none';

  fullPath = config.points.map(p => ({ xPct: p.xPct, yPct: p.yPct }));
  const arclen = arcLengthTable(fullPath);
  const totalArc = arclen[arclen.length-1] || 1;

  checkpoints = [];
  checkpointArc = [];
  config.points.forEach((p, i) => {
    if (p.checkpoint){
      checkpoints.push(p.checkpoint);
      checkpointArc.push(arclen[i] / totalArc);
    }
  });

  cumKm = [0];
  for (let i=1;i<checkpoints.length;i++){
    cumKm.push(cumKm[i-1] + (Number(checkpoints[i].distFromPrevKm)||0));
  }
  totalKm = cumKm[cumKm.length-1] || 1;

  // Sprite del corredor
  runnerSpriteUrl = config.runnerSprite || '';
  const runner = document.createElement('div');
  runner.id = 'runner';
  runner.innerHTML = `<img src="${config.runnerSprite || ''}" alt="corredor">`;
  document.getElementById('mapinner').appendChild(runner);
  window.__runner = runner;

  // Marcadors + etiquetes ETA per checkpoint
  window.__cpMarkerEls = checkpoints.map((c, i) => {
    const pos = pointOnPath(checkpointArc[i]);
    const el = document.createElement('div');
    el.className = 'cp-marker';
    el.style.left = pos.x + '%';
    el.style.top = pos.y + '%';
    document.getElementById('mapinner').appendChild(el);
    return el;
  });
  window.__cpEtaEls = checkpoints.map((c, i) => {
    const pos = pointOnPath(checkpointArc[i]);
    const el = document.createElement('div');
    el.className = 'cp-eta';
    el.style.left = pos.x + '%';
    el.style.top = pos.y + '%';
    document.getElementById('mapinner').appendChild(el);
    return el;
  });

  const xpwrap = document.getElementById('xpwrap');
  checkpoints.forEach((c,i) => {
    if (i===0) return;
    const tick = document.createElement('div');
    tick.className = 'xptick';
    tick.style.left = (cumKm[i]/totalKm*100) + '%';
    xpwrap.appendChild(tick);
  });

  return true;
}

/* =========================================================
   RENDER DE L'ESTAT (posició, HUD, toast)
   ========================================================= */
const xpfill = document.getElementById('xpfill');
const kmlabel = document.getElementById('kmlabel');
const levellabel = document.getElementById('levellabel');
const nextcp = document.getElementById('nextcp');
const toast = document.getElementById('toast');
const statusLine = document.getElementById('status-line');
const mapwrap = document.getElementById('mapwrap');

let lastReachedIndex = -1;

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function render(km){
  if (checkpoints.length === 0) return;
  const currentKm = Math.min(Math.max(km,0), totalKm);
  xpfill.style.width = (currentKm/totalKm*100) + '%';
  kmlabel.textContent = currentKm.toFixed(1) + ' / ' + totalKm.toFixed(1) + ' KM';
  levellabel.textContent = 'LV.' + (Math.floor(currentKm/totalKm*checkpoints.length)+1);

  const arcFrac = arcFracAtKm(currentKm);
  const pos = pointOnPath(arcFrac);
  const runner = window.__runner;
  if (runner){ runner.style.left = pos.x + '%'; runner.style.top = pos.y + '%'; }

  const mapimg = document.getElementById('mapimg');
  if (mapimg.offsetHeight){
    const targetScrollTop = (pos.y/100) * mapimg.offsetHeight - mapwrap.clientHeight*0.4;
    mapwrap.scrollTo({ top: Math.max(targetScrollTop,0), behavior:'smooth' });
  }

  let reachedIndex = -1;
  checkpoints.forEach((c,i) => {
    const reached = currentKm >= cumKm[i]-0.05;
    if (window.__cpMarkerEls[i]) window.__cpMarkerEls[i].classList.toggle('reached', reached);
    if (reached) reachedIndex = i;
  });

  if (reachedIndex !== lastReachedIndex && reachedIndex >= 0){
    lastReachedIndex = reachedIndex;
    showToast((reachedIndex === checkpoints.length-1 ? '🏁 Arribada a ' : '🏅 Checkpoint: ') + checkpoints[reachedIndex].name);
  }

  const nextIndex = checkpoints.findIndex((c,i) => cumKm[i] > currentKm + 0.05);
  nextcp.innerHTML = nextIndex === -1
    ? 'Proper punt: <b>Arribada! 🏁</b>'
    : `Proper punt: <b>${checkpoints[nextIndex].name}</b> · ${(cumKm[nextIndex]-currentKm).toFixed(1)} km`;
}

function fmtHM(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function computeEtas(state){
  const etas = new Array(checkpoints.length).fill(null);
  for (let i=0;i<=state.currentIndex;i++){
    etas[i] = (state.arrivals && state.arrivals[String(i)]) || null;
  }
  let anchorTime, anchorIndex;
  if (state.status === 'moving'){
    anchorTime = state.segmentStart + state.segmentDuration;
    anchorIndex = state.targetIndex;
    etas[anchorIndex] = anchorTime;
  } else {
    anchorTime = Date.now();
    anchorIndex = state.currentIndex;
  }
  for (let i=anchorIndex+1; i<checkpoints.length; i++){
    const pace = (state.paces && state.paces[String(i)]) || Number(checkpoints[i].paceMinKm) || 7.5;
    const distKm = cumKm[i]-cumKm[i-1];
    anchorTime += distKm * pace * 60000;
    etas[i] = anchorTime;
  }
  return etas;
}

function renderEtaLabels(state){
  const etas = computeEtas(state);
  checkpoints.forEach((c, i) => {
    const el = window.__cpEtaEls[i];
    if (!el) return;
    const isDone = i <= state.currentIndex;
    const isCurrentTarget = state.status === 'moving' && state.targetIndex === i;
    el.classList.toggle('done', isDone);
    el.classList.toggle('current', isCurrentTarget && !isDone);
    if (etas[i] == null) el.textContent = '—';
    else if (isDone) el.textContent = (i === 0 ? '🏁 ' : '✓ ') + fmtHM(etas[i]);
    else el.textContent = '~' + fmtHM(etas[i]);
  });
}

function renderStatusLine(state){
  if (state.status === 'finished'){ statusLine.textContent = '🏁 Repte completat!'; return; }
  if (state.status === 'moving'){
    const target = checkpoints[state.targetIndex];
    const eta = state.segmentStart + state.segmentDuration;
    const remaining = Math.max(0, Math.round((eta - Date.now())/60000));
    statusLine.textContent = `En marxa cap a ${target.name} · ETA ${fmtHM(eta)} (~${remaining} min)`;
  } else {
    statusLine.textContent = `Aturat a ${checkpoints[state.currentIndex].name}`;
  }
}

function currentKmFromState(state){
  if (!state || checkpoints.length===0) return 0;
  if (state.status === 'moving'){
    const elapsed = Date.now() - state.segmentStart;
    const frac = Math.min(1, Math.max(0, elapsed / state.segmentDuration));
    return cumKm[state.currentIndex] + frac * (cumKm[state.targetIndex] - cumKm[state.currentIndex]);
  }
  if (state.status === 'finished') return totalKm;
  return cumKm[state.currentIndex];
}

let serverState = null;

async function poll(){
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/get-position`, { cache: 'no-store' });
    const state = await res.json();
    serverState = state;
    render(currentKmFromState(state));
    renderEtaLabels(state);
    renderStatusLine(state);
  } catch (e) {
    statusLine.textContent = '⚠ Sense connexió amb el servidor';
  }
}

setInterval(() => {
  if (!serverState) return;
  render(currentKmFromState(serverState));
  if (serverState.status === 'moving') renderStatusLine(serverState);
}, 1000);

/* =========================================================
   MODE GPS (satèl·lit real) — es carrega Leaflet només quan
   cal, i es consulta el pont amb Garmin LiveTrack via la
   funció get-gps-track (que fa de caché i evita CORS).
   ========================================================= */
let gpsMode = false;
let gpsMap = null, gpsPolyline = null, gpsMarker = null;
let leafletLoaded = false;
let runnerSpriteUrl = '';

function loadLeaflet(){
  if (leafletLoaded) return Promise.resolve();
  return new Promise((resolve) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    script.onload = () => { leafletLoaded = true; resolve(); };
    document.head.appendChild(script);
  });
}

async function initGpsMap(){
  await loadLeaflet();
  if (gpsMap) return;
  gpsMap = L.map('gpsmap', { zoomControl: true }).setView([41.68, 1.87], 12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery',
    maxZoom: 18,
  }).addTo(gpsMap);
  gpsPolyline = L.polyline([], { color: '#FF6B47', weight: 4, opacity: 0.9 }).addTo(gpsMap);
}

async function refreshGpsTrack(){
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/get-gps-track`, { cache: 'no-store' });
    const data = await res.json();
    const empty = document.getElementById('gpsempty');

    if (!data.available || !data.points || data.points.length === 0){
      empty.style.display = 'flex';
      empty.textContent = '📡 ' + (data.reason || 'Encara no hi ha senyal GPS.') ;
      return;
    }
    empty.style.display = 'none';

    const latlngs = data.points.map(p => [p.lat, p.lng]);
    gpsPolyline.setLatLngs(latlngs);

    const last = latlngs[latlngs.length - 1];
    if (!gpsMarker){
      const icon = L.divIcon({
        className: '',
        html: `<div class="runner-gps-icon">${runnerSpriteUrl ? `<img src="${runnerSpriteUrl}">` : ''}</div>`,
        iconSize: [34,34], iconAnchor: [17,17]
      });
      gpsMarker = L.marker(last, { icon }).addTo(gpsMap);
    } else {
      gpsMarker.setLatLng(last);
    }
    gpsMap.panTo(last, { animate: true });
  } catch (e) {
    document.getElementById('gpsempty').style.display = 'flex';
    document.getElementById('gpsempty').textContent = '⚠ Error consultant el GPS';
  }
}

let gpsInterval = null;
async function setGpsMode(on){
  gpsMode = on;
  document.getElementById('gpsview').style.display = on ? 'block' : 'none';
  document.getElementById('mapinner').style.display = on ? 'none' : 'block';
  document.getElementById('modetoggle').textContent = on ? '🗺️ Mode Fantasy' : '🛰️ Mode GPS';

  if (on){
    await initGpsMap();
    setTimeout(() => gpsMap.invalidateSize(), 150);
    refreshGpsTrack();
    if (gpsInterval) clearInterval(gpsInterval);
    gpsInterval = setInterval(refreshGpsTrack, 20000);
  } else if (gpsInterval){
    clearInterval(gpsInterval);
    gpsInterval = null;
  }
}

document.getElementById('modetoggle').addEventListener('click', () => setGpsMode(!gpsMode));

(async () => {
  const ok = await loadConfig();
  if (!ok) return;
  await poll();
  setInterval(poll, 8000);
})();
</script>
</body>
</html>
