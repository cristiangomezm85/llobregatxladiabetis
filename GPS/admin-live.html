<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Admin · Llobregat x la Diabetis</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0E1B36; --llobregat:#15315F; --diabetis:#1E72D4;
    --aigua:#5AC0E6; --coral:#FF6B47; --paper:#FAFAF6; --gris:#5A6478;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{ background:var(--tinta); color:var(--paper); font-family:'Manrope',sans-serif; }
  #app{ max-width:480px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-size:17px; }
  .sub{ font-size:11px; color:var(--aigua); margin-bottom:18px; }

  #login{ display:flex; flex-direction:column; gap:10px; margin-top:40px; }
  #login input{ background:rgba(255,255,255,0.08); border:1px solid var(--gris); color:var(--paper); border-radius:6px; padding:14px; font-size:16px; }
  #login button{ background:var(--coral); color:var(--tinta); border:none; border-radius:8px; padding:14px; font-weight:800; font-size:15px; cursor:pointer; }

  #panel{ display:none; flex:1; flex-direction:column; }

  #currentcard{
    background:rgba(255,255,255,0.06); border:1px solid var(--gris); border-radius:12px;
    padding:16px; margin-bottom:14px; text-align:center;
  }
  #currentcard .from{ font-size:11px; color:var(--gris); text-transform:uppercase; letter-spacing:1px; }
  #currentcard .to{ font-family:'Bricolage Grotesque',sans-serif; font-size:22px; font-weight:800; margin:4px 0; }
  #currentcard .eta{ font-size:13px; color:var(--aigua); }

  #paceRow{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; }
  #paceRow label{ font-size:11px; color:var(--gris); text-transform:uppercase; letter-spacing:1px; }
  #paceinput{
    width:70px; background:rgba(255,255,255,0.08); border:1px solid var(--gris); color:var(--paper);
    border-radius:8px; padding:10px; font-size:16px; text-align:center;
  }

  #mainbtn{
    width:100%; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:19px;
    background:var(--coral); color:var(--tinta); border:none; border-radius:14px;
    padding:26px; cursor:pointer; margin-bottom:12px; box-shadow:0 4px 0 #b8492f;
  }
  #mainbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #b8492f; }
  #mainbtn:disabled{ background:var(--gris); box-shadow:none; opacity:0.6; }
  #mainbtn.waiting{ background:var(--diabetis); box-shadow:0 4px 0 #144f94; }

  .secrow{ display:flex; gap:10px; margin-bottom:16px; }
  .secbtn{
    flex:1; font-family:'Manrope',sans-serif; font-weight:800; font-size:13px;
    background:rgba(255,255,255,0.08); color:var(--paper); border:1px solid var(--gris);
    border-radius:10px; padding:14px; cursor:pointer;
  }
  .secbtn.danger{ border-color:var(--coral); color:var(--coral); }
  .secbtn:disabled{ opacity:0.4; }

  #progress{ margin-bottom:16px; }
  .steprow{ display:flex; align-items:center; gap:8px; font-size:12px; padding:6px 0; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; background:var(--gris); }
  .dot.done{ background:var(--diabetis); }
  .dot.current{ background:var(--coral); }
  .steprow.done{ color:var(--aigua); }
  .steprow .nm{ flex:1; }

  #err{ color:var(--coral); font-size:12px; text-align:center; margin-bottom:10px; min-height:14px; }

  /* Modal de confirmació */
  #modalbg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100;
    align-items:center; justify-content:center; padding:24px;
  }
  #modalbg.show{ display:flex; }
  #modalbox{
    background:var(--llobregat); border:2px solid var(--aigua); border-radius:14px;
    padding:22px; max-width:360px; width:100%; text-align:center;
  }
  #modalbox p{ font-size:15px; margin-bottom:18px; line-height:1.4; }
  #modalbox .mrow{ display:flex; gap:10px; }
  #modalbox button{ flex:1; font-weight:800; font-size:14px; border:none; border-radius:8px; padding:14px; cursor:pointer; }
  #modalYes{ background:var(--coral); color:var(--tinta); }
  #modalNo{ background:rgba(255,255,255,0.1); color:var(--paper); }
</style>
</head>
<body>
<div id="app">
  <h1>🏃 Live Admin</h1>
  <div class="sub">Llobregat x la Diabetis</div>

  <div id="login">
    <input id="tokeninput" type="password" placeholder="Token d'admin">
    <button id="loginbtn">Entrar</button>
    <div id="loginerror" style="color:var(--coral); font-size:12px; display:none;">Token incorrecte</div>
  </div>

  <div id="panel">
    <div id="err"></div>

    <div id="stagebox" style="margin-bottom:16px; border:1px solid rgba(90,192,230,0.3); border-radius:10px; padding:12px;">
      <label style="font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--gris); display:block; margin-bottom:8px;">
        🗺️ Etapa activa ara mateix
      </label>
      <select id="stageSelect" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid var(--gris); color:var(--paper); border-radius:8px; padding:10px; font-size:13px;"></select>
      <div id="stageStatus" style="font-size:11px; color:var(--aigua); margin-top:6px;"></div>
    </div>

    <div id="currentcard">
      <div class="from" id="fromline">—</div>
      <div class="to" id="toline">Carregant...</div>
      <div class="eta" id="etaline"></div>
    </div>

    <div id="paceRow">
      <label>Ritme</label>
      <input id="paceinput" type="number" step="0.5" min="1" value="7.5">
      <label style="margin-left:-4px;">min/km</label>
    </div>

    <button id="mainbtn">Carregant...</button>

    <div class="secrow">
      <button class="secbtn" id="undobtn">↩ Desfer</button>
      <button class="secbtn danger" id="resetbtn">⚠ Reiniciar</button>
    </div>
    <div class="secrow">
      <button class="secbtn" id="sleepbtn">😴 Marcar com a dormint</button>
    </div>

    <div id="progress"></div>

    <div id="owntracksbox" style="margin-top:18px; border-top:1px solid rgba(90,192,230,0.2); padding-top:14px;">
      <label style="font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--gris); display:block; margin-bottom:6px;">
        📍 GPS real (OwnTracks) — recomanat
      </label>
      <div style="font-size:11px; color:var(--paper); opacity:0.85; margin-bottom:8px; line-height:1.5;">
        Instal·la <b>OwnTracks</b> al mòbil del corredor (Android/iPhone). Als seus ajustos, posa Mode = <b>HTTP</b> i el camp Host exactament com aquest (ja porta el teu token):
      </div>
      <div id="owntracksUrl" style="font-size:10px; word-break:break-all; background:rgba(255,255,255,0.08); border-radius:8px; padding:10px; margin-bottom:8px; color:var(--aigua);"></div>
      <button id="copyOwntracksUrlBtn" class="secbtn" style="width:100%; margin-bottom:8px;">📋 Copiar l'URL</button>
      <button id="resetGpsBtn" class="secbtn danger" style="width:100%;">🗑 Esborrar traçat GPS (per començar de nou)</button>
      <div id="owntracksStatus" style="font-size:11px; color:var(--aigua); margin-top:6px;"></div>
    </div>
  </div>
</div>

<div id="modalbg">
  <div id="modalbox">
    <p id="modaltext">Confirmes?</p>
    <div class="mrow">
      <button id="modalNo">Cancel·lar</button>
      <button id="modalYes">Sí, confirmar</button>
    </div>
  </div>
</div>

<script>
const FUNCTIONS_BASE = '/.netlify/functions';
let token = localStorage.getItem('lxd_admin_token') || '';
let checkpoints = [];
let cumKm = [];
let rawConfig = null;
let currentActiveStageId = null;

function findStage(stageId){
  if (!rawConfig || !Array.isArray(rawConfig.stages) || rawConfig.stages.length === 0) return null;
  return rawConfig.stages.find(s => s.id === stageId) || rawConfig.stages[0];
}

function buildCheckpointsForStage(stage){
  checkpoints = (stage.points || []).filter(p => p.checkpoint).map(p => p.checkpoint);
  cumKm = [0];
  for (let i=1;i<checkpoints.length;i++) cumKm.push(cumKm[i-1] + (Number(checkpoints[i].distFromPrevKm)||0));
}

function populateStageSelect(activeId){
  const sel = document.getElementById('stageSelect');
  sel.innerHTML = '';
  (rawConfig.stages || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name || s.id;
    if (s.id === activeId) opt.selected = true;
    sel.appendChild(opt);
  });
}
let state = null;

const loginEl = document.getElementById('login');
const panelEl = document.getElementById('panel');
const errEl = document.getElementById('err');
const mainbtn = document.getElementById('mainbtn');
const paceinput = document.getElementById('paceinput');
const fromline = document.getElementById('fromline');
const toline = document.getElementById('toline');
const etaline = document.getElementById('etaline');
const progress = document.getElementById('progress');

function showError(msg){ errEl.textContent = msg || ''; }

/* =========================================================
   MODAL DE CONFIRMACIÓ — cap acció important s'aplica sense
   passar per aquí. Pensat perquè, corrent, un toc accidental
   mai executi res sol.
   ========================================================= */
const modalbg = document.getElementById('modalbg');
const modaltext = document.getElementById('modaltext');
function askConfirm(text){
  return new Promise((resolve) => {
    modaltext.textContent = text;
    modalbg.classList.add('show');
    function cleanup(result){
      modalbg.classList.remove('show');
      document.getElementById('modalYes').removeEventListener('click', onYes);
      document.getElementById('modalNo').removeEventListener('click', onNo);
      resolve(result);
    }
    function onYes(){ cleanup(true); }
    function onNo(){ cleanup(false); }
    document.getElementById('modalYes').addEventListener('click', onYes);
    document.getElementById('modalNo').addEventListener('click', onNo);
  });
}

async function apiGet(path){
  const res = await fetch(`${FUNCTIONS_BASE}/${path}`, { cache: 'no-store' });
  if (!res.ok) {
    let detail = '';
    try { detail = await res.text(); } catch(e){}
    throw new Error(`${path} → ${res.status} ${res.statusText} ${detail ? '· ' + detail.slice(0,150) : ''}`);
  }
  return res.json();
}
async function apiPost(body){
  const res = await fetch(`${FUNCTIONS_BASE}/set-position`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify(body)
  });
  let data;
  try { data = await res.json(); } catch(e){ data = {}; }
  if (!res.ok) throw new Error(`(${res.status}) ${data.error || res.statusText || 'Error desconegut'}${data.detail ? ' · ' + data.detail : ''}`);
  return data;
}

function fmtHM(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function paceFor(i){
  if (state && state.paces && state.paces[String(i)]) return state.paces[String(i)];
  if (checkpoints[i] && checkpoints[i].paceMinKm) return checkpoints[i].paceMinKm;
  return 7.5;
}

function renderProgress(){
  progress.innerHTML = '';
  checkpoints.forEach((c, i) => {
    const done = state.currentIndex >= i;
    const current = state.status === 'moving' ? state.targetIndex === i : state.currentIndex + 1 === i;
    const row = document.createElement('div');
    row.className = 'steprow' + (done ? ' done' : '');
    row.innerHTML = `<div class="dot ${done ? 'done' : (current ? 'current' : '')}"></div><div class="nm">${c.name}</div>`;
    progress.appendChild(row);
  });
}

function renderCard(){
  if (checkpoints.length === 0){
    toline.textContent = '⚠ Sense configuració';
    fromline.textContent = 'Ves a config-admin.html i desa el recorregut primer';
    etaline.textContent = '';
    mainbtn.disabled = true;
    mainbtn.textContent = 'Falta configuració';
    return;
  }
  if (!state) return;

  if (state.status === 'finished'){
    fromline.textContent = 'Repte completat';
    toline.textContent = '🏁 ' + checkpoints[checkpoints.length-1].name;
    etaline.textContent = '';
    mainbtn.textContent = '🏁 Repte completat';
    mainbtn.disabled = true;
    mainbtn.classList.remove('waiting');
  } else if (state.status === 'moving'){
    const target = checkpoints[state.targetIndex];
    fromline.textContent = `Des de ${checkpoints[state.currentIndex].name}`;
    toline.textContent = '→ ' + target.name;
    const eta = state.segmentStart + state.segmentDuration;
    const remaining = Math.max(0, Math.round((eta - Date.now())/60000));
    etaline.textContent = `ETA ${fmtHM(eta)} · ~${remaining} min`;
    mainbtn.textContent = `✅ Ja hi som a ${target.name}`;
    mainbtn.classList.add('waiting');
    mainbtn.disabled = false;
    paceinput.value = paceFor(state.targetIndex);
  } else {
    fromline.textContent = 'Aturats a';
    toline.textContent = checkpoints[state.currentIndex].name;
    etaline.textContent = '';
    const next = checkpoints[state.currentIndex + 1];
    mainbtn.textContent = `🏃 Sortim cap a ${next.name}`;
    mainbtn.classList.remove('waiting');
    mainbtn.disabled = false;
    paceinput.value = paceFor(state.currentIndex + 1);
  }

  document.getElementById('undobtn').disabled = !state.history || state.history.length === 0;
  document.getElementById('sleepbtn').textContent = state.sleeping ? '☀️ Despertar' : '😴 Marcar com a dormint';
  renderProgress();
}

mainbtn.addEventListener('click', async () => {
  if (!state) return;
  if (state.status === 'moving'){
    const target = checkpoints[state.targetIndex];
    const ok = await askConfirm(`Confirmes que heu arribat a ${target.name}?`);
    if (!ok) return;
    try {
      state = await apiPost({ action: 'confirm' });
      renderCard();
    } catch (e) { showError(e.message); }
  } else {
    const next = checkpoints[state.currentIndex + 1];
    const ok = await askConfirm(`Iniciar tram cap a ${next.name}?`);
    if (!ok) return;
    try {
      const pace = parseFloat(paceinput.value) || paceFor(state.currentIndex + 1);
      state = await apiPost({ action: 'start', pace });
      renderCard();
    } catch (e) { showError(e.message); }
  }
});

document.getElementById('undobtn').addEventListener('click', async () => {
  const ok = await askConfirm('Desfer l\'última acció? Tornaràs a l\'estat anterior.');
  if (!ok) return;
  try {
    state = await apiPost({ action: 'undo' });
    renderCard();
  } catch (e) { showError(e.message); }
});

document.getElementById('resetbtn').addEventListener('click', async () => {
  const ok = await askConfirm('⚠ Reiniciar TOTA la cursa des de zero? Això no es pot desfer.');
  if (!ok) return;
  try {
    state = await apiPost({ action: 'reset' });
    renderCard();
  } catch (e) { showError(e.message); }
});

document.getElementById('sleepbtn').addEventListener('click', async () => {
  const goingToSleep = !(state && state.sleeping);
  const ok = await askConfirm(goingToSleep ? 'Marcar el corredor com a dormint (descans llarg)?' : 'Despertar el corredor?');
  if (!ok) return;
  try {
    state = await apiPost({ action: 'setSleeping', sleeping: goingToSleep });
    renderCard();
  } catch (e) { showError(e.message); }
});

document.getElementById('copyOwntracksUrlBtn').addEventListener('click', () => {
  const text = document.getElementById('owntracksUrl').textContent;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('owntracksStatus').textContent = '✓ URL copiada';
  }).catch(() => {
    document.getElementById('owntracksStatus').textContent = '⚠ No s\'ha pogut copiar automàticament — selecciona-la manualment.';
  });
});

document.getElementById('resetGpsBtn').addEventListener('click', async () => {
  if (!confirm('Això esborra tot el traçat GPS acumulat fins ara. Continuar?')) return;
  const status = document.getElementById('owntracksStatus');
  status.textContent = 'Esborrant...';
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/reset-gps-track`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) throw new Error('(' + res.status + ') ' + res.statusText);
    status.textContent = '✓ Traçat GPS esborrat';
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
});

async function poll(){
  try {
    state = await apiGet('get-position');
    renderCard();
    showError('');
  } catch (e) {
    showError('⚠ Sense connexió amb el servidor');
  }
}

async function startPanel(){
  loginEl.style.display = 'none';
  panelEl.style.display = 'flex';

  // Això no depèn de cap dada de configuració, així que ho fem sempre
  // el primer de tot — abans que res pugui fallar i tallar la resta.
  document.getElementById('owntracksUrl').textContent =
    `${window.location.origin}${FUNCTIONS_BASE}/receive-gps-point?token=${encodeURIComponent(token)}`;

  try {
    const config = await apiGet('get-config');
    // Compatibilitat amb configuracions antigues sense "stages".
    if (!Array.isArray(config.stages) || config.stages.length === 0) {
      if (Array.isArray(config.points) && config.points.length > 0) {
        config.stages = [{ id: 'default', name: 'Recorregut', mapImageDay: config.mapImage || null, mapImageNight: config.mapImage || null, points: config.points }];
      } else {
        config.stages = [];
      }
    }
    rawConfig = config;
    if (rawConfig.stages.length === 0) {
      showError('⚠ Encara no hi ha cap etapa configurada — ves primer a config-admin.html i crea\'n una.');
      return;
    }
  } catch (e) {
    showError('⚠ Config: ' + e.message);
    return;
  }

  try {
    state = await apiGet('get-position');
  } catch (e) {
    showError('⚠ Sense connexió amb el servidor');
    return;
  }

  currentActiveStageId = state.activeStageId || rawConfig.stages[0].id;
  populateStageSelect(currentActiveStageId);
  buildCheckpointsForStage(findStage(currentActiveStageId));

  renderCard();
  await poll();
  setInterval(poll, 5000);
  setInterval(() => { if (state && state.status === 'moving') renderCard(); }, 1000);
}

document.getElementById('stageSelect').addEventListener('change', async (e) => {
  const newId = e.target.value;
  const stageStatus = document.getElementById('stageStatus');
  const stage = findStage(newId);
  const ok = confirm(`Canviar a l'etapa "${stage ? (stage.name || stage.id) : newId}" reinicia el progrés de cursa (tornem al km 0 d'aquesta etapa). El traçat GPS i els sprites NO es toquen. Continuar?`);
  if (!ok) {
    e.target.value = currentActiveStageId;
    return;
  }
  stageStatus.textContent = 'Canviant d\'etapa...';
  try {
    state = await apiPost({ action: 'setActiveStage', stageId: newId });
    currentActiveStageId = newId;
    buildCheckpointsForStage(findStage(newId));
    renderCard();
    stageStatus.textContent = `✓ Etapa activa: ${stage ? (stage.name || stage.id) : newId}`;
  } catch (err) {
    stageStatus.textContent = '⚠ ' + err.message;
    e.target.value = currentActiveStageId;
  }
});

document.getElementById('loginbtn').addEventListener('click', async () => {
  const val = document.getElementById('tokeninput').value.trim();
  if (!val) return;
  const errEl2 = document.getElementById('loginerror');
  if (/[^\x00-\xFF]/.test(val)) {
    errEl2.textContent = '⚠ El token conté caràcters no vàlids (emojis, accents estranys...)';
    errEl2.style.display = 'block';
    return;
  }
  const btn = document.getElementById('loginbtn');
  btn.disabled = true;
  btn.textContent = 'Comprovant...';
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/set-position`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${val}` },
      body: JSON.stringify({ action: 'ping' })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errEl2.textContent = res.status === 401 ? '⚠ Token incorrecte' : `⚠ Error (${res.status}): ${data.error || res.statusText}${data.detail ? ' · ' + data.detail : ''}`;
      errEl2.style.display = 'block';
      return;
    }
    token = val;
    localStorage.setItem('lxd_admin_token', token);
    errEl2.style.display = 'none';
    startPanel();
  } catch (e) {
    errEl2.textContent = '⚠ Sense connexió: ' + e.message;
    errEl2.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

if (token) startPanel();
</script>
</body>
</html>
